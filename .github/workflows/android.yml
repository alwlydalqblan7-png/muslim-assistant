name: Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Show environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Install required Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate bundled sources
        run: python3 scripts/validate_assets.py
      - name: Restore existing signing key when configured
        env:
          SIGNING_STORE_BASE64: ${{ secrets.MUSLIM_SIGNING_STORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUSLIM_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSLIM_SIGNING_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSLIM_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_STORE_BASE64" ]; then
            printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/muslim-signing.jks"
            chmod 600 "$RUNNER_TEMP/muslim-signing.jks"
            echo "MUSLIM_SIGNING_STORE=$RUNNER_TEMP/muslim-signing.jks" >> "$GITHUB_ENV"
          fi
      - name: Test, lint and build unified APK
        env:
          MUSLIM_SIGNING_STORE_PASSWORD: ${{ secrets.MUSLIM_SIGNING_STORE_PASSWORD }}
          MUSLIM_SIGNING_ALIAS: ${{ secrets.MUSLIM_SIGNING_ALIAS }}
          MUSLIM_SIGNING_KEY_PASSWORD: ${{ secrets.MUSLIM_SIGNING_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Inspect APK signature and version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5
          if [ -z "$MUSLIM_SIGNING_STORE" ]; then
            echo 'Test APK only: disposable debug signature. Do not uninstall an existing app.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/muslim-signing.jks"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muslim-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
